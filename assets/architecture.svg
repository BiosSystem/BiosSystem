<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1017"/>
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091d14"/>
      <stop offset="100%" stop-color="#05120c"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a29"/>
      <stop offset="100%" stop-color="#030f18"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b24"/>
      <stop offset="100%" stop-color="#0e0517"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221105"/>
      <stop offset="100%" stop-color="#130902"/>
    </linearGradient>

    <!-- Subtle Cyber Grid -->
    <pattern id="ecoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF72" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .section-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 3px; }
    .section-subtitle { font-family: 'SF Mono', Consolas, 'Roboto Mono', monospace; font-size: 11px; letter-spacing: 2px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
    .card-meta { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 1px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #a1a1aa; }
    .tag-txt { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" rx="16" fill="url(#ecoGrid)"/>
  <rect x="1" y="1" width="1198" height="478" rx="15" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Decorative Corner Accents -->
  <path d="M 20,32 L 20,20 L 32,20" fill="none" stroke="#00FF72" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1180,32 L 1180,20 L 1168,20" fill="none" stroke="#00FF72" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20,448 L 20,460 L 32,460" fill="none" stroke="#00FF72" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1180,448 L 1180,460 L 1168,460" fill="none" stroke="#00FF72" stroke-width="2" stroke-linecap="round"/>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(600, 36)">
    <text x="0" y="0" text-anchor="middle" fill="#00FF72" class="section-title" filter="url(#neonGlow)">
      ENGINEERING ECOSYSTEM &amp; DOMAIN ARCHITECTURE
    </text>
    <text x="0" y="20" text-anchor="middle" fill="#8b949e" class="section-subtitle">
      INTERACTIVE RUNTIMES  •  REACTIVE WEB  •  SPATIAL TELEMETRY  •  SYSTEMS &amp; GITOPS
    </text>
  </g>

  <!-- ================= 4 PILLAR CARDS GRID ================= -->

  <!-- ===== PILLAR 1: INTERACTIVE RUNTIMES & EMULATION ===== -->
  <g transform="translate(30, 75)">
    <!-- Container -->
    <rect width="555" height="175" rx="12" fill="url(#cardGrad1)" stroke="#00FF72" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="20" cy="22" r="5" fill="#00FF72"/>
    <text x="34" y="26" fill="#00FF72" class="card-title">INTERACTIVE RUNTIMES &amp; EMULATION</text>
    <text x="535" y="25" text-anchor="end" fill="#8b949e" class="card-meta">DESKTOP / ENGINE CORE</text>

    <!-- Sub-item 1: retro-game-replicas -->
    <g transform="translate(18, 42)">
      <rect width="252" height="118" rx="8" fill="#06130d" stroke="#00FF72" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">retro-game-replicas</text>
      <text x="12" y="40" class="item-desc">Cross-platform arcade launcher &amp; recreations</text>
      <text x="12" y="56" class="item-desc">60 FPS canvas with GLSL CRT post-processing</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="90" height="18" rx="4" fill="#00FF72" fill-opacity="0.12"/>
      <text x="17" y="81" fill="#00FF72" class="tag-txt">Tauri v2 • Phaser 3</text>
      
      <rect x="108" y="68" width="82" height="18" rx="4" fill="#00FF72" fill-opacity="0.12"/>
      <text x="113" y="81" fill="#00FF72" class="tag-txt">Gamepad API</text>
      
      <rect x="12" y="91" width="102" height="18" rx="4" fill="#00FF72" fill-opacity="0.12"/>
      <text x="17" y="104" fill="#00FF72" class="tag-txt">Local State Caches</text>
    </g>

    <!-- Sub-item 2: OriginalMS -->
    <g transform="translate(285, 42)">
      <rect width="252" height="118" rx="8" fill="#06130d" stroke="#00FF72" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">OriginalMS</text>
      <text x="12" y="40" class="item-desc">Full-fidelity MapleStory v62 server emulator</text>
      <text x="12" y="56" class="item-desc">Asynchronous socket I/O &amp; packet handling</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="108" height="18" rx="4" fill="#00FF72" fill-opacity="0.12"/>
      <text x="17" y="81" fill="#00FF72" class="tag-txt">Apache MINA Sockets</text>
      
      <rect x="126" y="68" width="80" height="18" rx="4" fill="#00FF72" fill-opacity="0.12"/>
      <text x="131" y="81" fill="#00FF72" class="tag-txt">Docker Stack</text>
      
      <rect x="12" y="91" width="115" height="18" rx="4" fill="#00FF72" fill-opacity="0.12"/>
      <text x="17" y="104" fill="#00FF72" class="tag-txt">Complete PQ Scripts</text>
    </g>
  </g>

  <!-- ===== PILLAR 2: HIGH-PERFORMANCE WEB & PWAS ===== -->
  <g transform="translate(615, 75)">
    <!-- Container -->
    <rect width="555" height="175" rx="12" fill="url(#cardGrad2)" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="20" cy="22" r="5" fill="#00E5FF"/>
    <text x="34" y="26" fill="#00E5FF" class="card-title">HIGH-PERFORMANCE WEB &amp; PWAS</text>
    <text x="535" y="25" text-anchor="end" fill="#8b949e" class="card-meta">FRONTEND / REACTIVE STATE</text>

    <!-- Sub-item 1: AuraTorrent -->
    <g transform="translate(18, 42)">
      <rect width="252" height="118" rx="8" fill="#04121d" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">AuraTorrent</text>
      <text x="12" y="40" class="item-desc">Responsive alternative WebUI for qBittorrent</text>
      <text x="12" y="56" class="item-desc">PWA offline shell &amp; Telegram finish alerts</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="95" height="18" rx="4" fill="#00E5FF" fill-opacity="0.12"/>
      <text x="17" y="81" fill="#00E5FF" class="tag-txt">Vue 3 • Vite • Pinia</text>
      
      <rect x="113" y="68" width="75" height="18" rx="4" fill="#00E5FF" fill-opacity="0.12"/>
      <text x="118" y="81" fill="#00E5FF" class="tag-txt">Security CSP</text>
      
      <rect x="12" y="91" width="100" height="18" rx="4" fill="#00E5FF" fill-opacity="0.12"/>
      <text x="17" y="104" fill="#00E5FF" class="tag-txt">Dynamic RSS Feeds</text>
    </g>

    <!-- Sub-item 2: StatZilla & BetForge -->
    <g transform="translate(285, 42)">
      <rect width="252" height="118" rx="8" fill="#04121d" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">StatZilla &amp; BetForge</text>
      <text x="12" y="40" class="item-desc">Gaming stats analytics &amp; dynamic odds models</text>
      <text x="12" y="56" class="item-desc">Direct Supercell APIs &amp; in-play cash-out flows</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="102" height="18" rx="4" fill="#00E5FF" fill-opacity="0.12"/>
      <text x="17" y="81" fill="#00E5FF" class="tag-txt">React 19 • Tailwind</text>
      
      <rect x="120" y="68" width="85" height="18" rx="4" fill="#00E5FF" fill-opacity="0.12"/>
      <text x="125" y="81" fill="#00E5FF" class="tag-txt">Live Battle Logs</text>
      
      <rect x="12" y="91" width="95" height="18" rx="4" fill="#00E5FF" fill-opacity="0.12"/>
      <text x="17" y="104" fill="#00E5FF" class="tag-txt">Slip Accumulation</text>
    </g>
  </g>

  <!-- ===== PILLAR 3: SPATIAL TELEMETRY & HARDWARE ===== -->
  <g transform="translate(30, 265)">
    <!-- Container -->
    <rect width="555" height="175" rx="12" fill="url(#cardGrad3)" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="20" cy="22" r="5" fill="#C084FC"/>
    <text x="34" y="26" fill="#C084FC" class="card-title">SPATIAL TELEMETRY &amp; HARDWARE</text>
    <text x="535" y="25" text-anchor="end" fill="#8b949e" class="card-meta">3D RUNTIMES / SENSOR PROBES</text>

    <!-- Sub-item 1: God's Eye View -->
    <g transform="translate(18, 42)">
      <rect width="252" height="118" rx="8" fill="#12071b" stroke="#C084FC" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">God's Eye View</text>
      <text x="12" y="40" class="item-desc">Interactive 3D geospatial intelligence globe</text>
      <text x="12" y="56" class="item-desc">Live orbital satellites, air &amp; sea traffic vectors</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="105" height="18" rx="4" fill="#C084FC" fill-opacity="0.15"/>
      <text x="17" y="81" fill="#C084FC" class="tag-txt">Cesium • Three.js</text>
      
      <rect x="123" y="68" width="82" height="18" rx="4" fill="#C084FC" fill-opacity="0.15"/>
      <text x="128" y="81" fill="#C084FC" class="tag-txt">Tactical HUD</text>
      
      <rect x="12" y="91" width="112" height="18" rx="4" fill="#C084FC" fill-opacity="0.15"/>
      <text x="17" y="104" fill="#C084FC" class="tag-txt">Real-Time Telemetry</text>
    </g>

    <!-- Sub-item 2: Therm Studio & Steady -->
    <g transform="translate(285, 42)">
      <rect width="252" height="118" rx="8" fill="#12071b" stroke="#C084FC" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">Therm Studio &amp; Steady</text>
      <text x="12" y="40" class="item-desc">USB cooler LCD suite &amp; network engine</text>
      <text x="12" y="56" class="item-desc">Direct hardware sensor canvas &amp; jitter probes</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="108" height="18" rx="4" fill="#C084FC" fill-opacity="0.15"/>
      <text x="17" y="81" fill="#C084FC" class="tag-txt">Hardware USB APIs</text>
      
      <rect x="126" y="68" width="85" height="18" rx="4" fill="#C084FC" fill-opacity="0.15"/>
      <text x="131" y="81" fill="#C084FC" class="tag-txt">Zero 3rd-Party</text>
      
      <rect x="12" y="91" width="105" height="18" rx="4" fill="#C084FC" fill-opacity="0.15"/>
      <text x="17" y="104" fill="#C084FC" class="tag-txt">320x320 Display I/O</text>
    </g>
  </g>

  <!-- ===== PILLAR 4: SYSTEMS & GITOPS INFRASTRUCTURE ===== -->
  <g transform="translate(615, 265)">
    <!-- Container -->
    <rect width="555" height="175" rx="12" fill="url(#cardGrad4)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="20" cy="22" r="5" fill="#F59E0B"/>
    <text x="34" y="26" fill="#F59E0B" class="card-title">SYSTEMS &amp; GITOPS INFRASTRUCTURE</text>
    <text x="535" y="25" text-anchor="end" fill="#8b949e" class="card-meta">AUTOMATION / CLOUD DELIVERY</text>

    <!-- Sub-item 1: Winnow -->
    <g transform="translate(18, 42)">
      <rect width="252" height="118" rx="8" fill="#180b03" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">Winnow</text>
      <text x="12" y="40" class="item-desc">Modular Windows optimization &amp; setup toolkit</text>
      <text x="12" y="56" class="item-desc">Audit verification mode &amp; zero-residue profiles</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="98" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="17" y="81" fill="#F59E0B" class="tag-txt">PowerShell Core</text>
      
      <rect x="116" y="68" width="75" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="121" y="81" fill="#F59E0B" class="tag-txt">Audit Engine</text>
      
      <rect x="12" y="91" width="105" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="17" y="104" fill="#F59E0B" class="tag-txt">Portable JSON Spec</text>
    </g>

    <!-- Sub-item 2: Cloud DevOps Sandboxes -->
    <g transform="translate(285, 42)">
      <rect width="252" height="118" rx="8" fill="#180b03" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="22" class="item-title">Cloud DevOps Sandboxes</text>
      <text x="12" y="40" class="item-desc">Automated GitOps pipelines &amp; secure cloud IaC</text>
      <text x="12" y="56" class="item-desc">Non-root containers &amp; Checkov/TFLint verified</text>
      
      <!-- Tags -->
      <rect x="12" y="68" width="85" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="17" y="81" fill="#F59E0B" class="tag-txt">Docker &amp; K8s</text>
      
      <rect x="103" y="68" width="90" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="108" y="81" fill="#F59E0B" class="tag-txt">Terraform AWS</text>
      
      <rect x="12" y="91" width="98" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="17" y="104" fill="#F59E0B" class="tag-txt">Trivy CI Security</text>
    </g>
  </g>
</svg>
